name: Deploy Bankjesjacht to GitHub Pages

# Publiceert de bankjes-app (web/bankjes) naar GitHub Pages.
# Pages wordt automatisch aangezet via enablement:true, dus je hoeft
# niets handmatig in de repo-instellingen te doen.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Zorg dat er maar één deploy tegelijk loopt.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload de bankjes-app als site
        uses: actions/upload-pages-artifact@v3
        with:
          # Alleen de app publiceren -> schone URL: /biosphere-/
          path: web/bankjes

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
